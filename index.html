<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Control de entradas · Spanish Championship 2026</title>

  <script type="module">
    import QrScanner from "https://unpkg.com/qr-scanner@1.4.2/qr-scanner.min.js";

    // URL de la implementación de Apps Script (la misma /exec de siempre)
    const API_URL = "https://script.google.com/macros/s/xxxxxxxxxxxxxxx/exec";

    const status = document.getElementById("status");
    const button = document.getElementById("scanButton");
    const flash = document.getElementById("flash");
    const video = document.getElementById("video");

    const okSound = new Audio("https://actions.google.com/sounds/v1/cartoon/pop.ogg");
    const errorSound = new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");

    let armed = false;
    let processing = false;

    // --- PIN del personal (se guarda en el móvil para no pedirlo cada vez) ---
    function getPin() {
      try { return localStorage.getItem("controlPin") || ""; } catch { return ""; }
    }
    function setPin(pin) {
      try { localStorage.setItem("controlPin", pin); } catch {}
    }
    function clearPin() {
      try { localStorage.removeItem("controlPin"); } catch {}
    }

    // --- Llamada a Apps Script (sustituye a google.script.run.validateQr) ---
    async function validateQr(uuid) {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 20000);
      try {
        const url =
          `${API_URL}?action=validate` +
          `&uuid=${encodeURIComponent(uuid)}` +
          `&pin=${encodeURIComponent(getPin())}`;
        const response = await fetch(url, { signal: controller.signal });
        return await response.json();
      } finally {
        clearTimeout(timeout);
      }
    }

    function feedback(type, text) {

      status.textContent = text;
      status.className = type;

      flash.className = type;

      navigator.vibrate?.(150);

      const sound = type === "ok" ? okSound : errorSound;
      sound.currentTime = 0;
      sound.play().catch(() => {});

      setTimeout(() => {

        flash.className = "";
        status.className = "";
        status.textContent = "Pulsa el botón para escanear";

        processing = false;
        armed = false;

        button.disabled = false;
        button.textContent = "Escanear entrada";

      }, 5000);
    }

    button.onclick = () => {
      if (!getPin()) {
        const pin = prompt("PIN de acceso del personal");
        if (!pin) return;
        setPin(pin.trim());
      }
      armed = true;
      button.disabled = true;
      button.textContent = "Apunta al QR";
      status.textContent = "Esperando QR";
    };

    const scanner = new QrScanner(
      video,
      async result => {

        if (!armed || processing) return;

        processing = true;
        armed = false;

        try {
          const res = await validateQr(result.data);

          if (res.status === "ok") {
            feedback("ok", "✅ " + res.name);
          } else if (res.status === "used") {
            feedback("used", "⚠ Entrada ya validada");
          } else if (res.status === "unauthorized") {
            clearPin();
            feedback("invalid", "🔒 PIN incorrecto");
          } else {
            feedback("invalid", "❌ Entrada inválida");
          }
        } catch (err) {
          feedback("invalid", "❌ Error");
        }

      },
      {
        preferredCamera: "environment",
        highlightScanRegion: true,
        highlightCodeOutline: true
      }
    );

    scanner.start().catch(err => {
      status.textContent = err;
    });
  </script>

  <style>

html,body{
margin:0;
padding:0;
background:#111;
color:white;
font-family:Arial,sans-serif;
height:100%;
overflow:hidden;
}

body{
display:flex;
flex-direction:column;
align-items:center;
}

h1{
margin:16px;
font-size:2rem;
}

#video{
width:100vw;
max-width:100vw;
height:auto;
aspect-ratio:1;
object-fit:cover;
background:black;
}

#scanButton{
width:92vw;
margin:20px;
padding:18px;
font-size:1.6rem;
border:none;
border-radius:14px;
background:#1976d2;
color:white;
font-weight:bold;
}

#scanButton:disabled{
opacity:.5;
}

#status{
width:92vw;
min-height:80px;
display:flex;
justify-content:center;
align-items:center;
font-size:1.4rem;
font-weight:bold;
border-radius:14px;
background:#333;
padding:16px;
text-align:center;
}

.ok{
background:#2e7d32;
}

.used{
background:#ef6c00;
}

.invalid{
background:#c62828;
}

#flash{
position:fixed;
inset:0;
pointer-events:none;
opacity:0;
transition:.15s;
}

#flash.ok{
background:#00ff00;
opacity:.25;
}

#flash.used{
background:orange;
opacity:.25;
}

#flash.invalid{
background:red;
opacity:.25;
}

  </style>

</head>

<body>

<h1>Control de entradas Spanish Championship 2026</h1>

<video id="video" muted playsinline></video>

<button id="scanButton">
Escanear entrada
</button>

<div id="status">
Pulsa el botón para escanear
</div>

<div id="flash"></div>

</body>
</html>
